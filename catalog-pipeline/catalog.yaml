# Learning Child — parent-curated video sources.
#
# Edit this file, push, and the catalog rebuilds automatically (GitHub Action).
# Docs: README.md at the repo root. Curation rationale + grades:
#   docs/research/2026-07-26-channel-research-results.md
# Hand-picked hero videos (verified live): docs/data/curated-videos.json
#
# Every @handle below was verified on youtube.com during research (2026-07-26);
# channel handles cross-checked via YouTube oEmbed against curated videos.
# topics vocabulary: science, maths, space, music, nature, animals, exploration,
